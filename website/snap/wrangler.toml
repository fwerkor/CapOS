name = "capos-snap"
main = "worker/index.ts"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/v2/*", "/download/*", "/embed", "/embed/*"]

# Fill the database id after creating the production D1 database:
# npx wrangler d1 create capos-snap-store
[[d1_databases]]
binding = "DB"
database_name = "capos-snap-store"
database_id = "fb9274f3-a475-4ba8-8d78-86ddad6f911a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "capos"

[[routes]]
pattern = "snap.capos.top"
custom_domain = true

[vars]
DEFAULT_VERSION = "rolling"
REPO_PUBLIC_BASE = "https://repo.capos.top"
ACCESS_TEAM_DOMAIN = "fwerkor.cloudflareaccess.com"
ACCESS_AUD = "c35348d6e3f59bc8857131672c0c59096083cdaaed23536cecee3d9921c2e2a5"
STORE_PUBLIC_BASE = "https://snap.capos.top"
