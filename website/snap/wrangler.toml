name = "capos-snap"
main = "worker/index.ts"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/v2/*", "/download/*", "/embed", "/embed/*"]

# Fill the database id after creating the production D1 database:
# npx wrangler d1 create capos-snap-store
[[d1_databases]]
binding = "DB"
database_name = "capos-snap-store"
database_id = "fb9274f3-a475-4ba8-8d78-86ddad6f911a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "capos"

[[routes]]
pattern = "snap.capos.top"
custom_domain = true

[vars]
DEFAULT_VERSION = "rolling"
REPO_PUBLIC_BASE = "https://repo.capos.top"
# Secrets: ADMIN_PIN_HASH, SESSION_SECRET
